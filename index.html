<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Süper Lig Tahmin — Ortak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#220e28;
    --bg-2:#2b1230;
    --line:rgba(255,255,255,0.09);
    --text:#ffffff;
    --text-dim:rgba(255,255,255,0.55);
    --gold:#f0c341;
    --green:#3fb27f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at top, var(--bg-2), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Poppins',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  .wrap{max-width:620px;margin:0 auto;padding:28px 24px 90px;}

  .player-bar{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:26px;}
  .player-btn{
    font-family:'Poppins',sans-serif;
    font-weight:600;
    font-size:12.5px;
    color:var(--text-dim);
    background:rgba(255,255,255,0.05);
    border:1px solid var(--line);
    border-radius:100px;
    padding:8px 15px;
    cursor:pointer;
  }
  .player-btn:hover{border-color:var(--gold);color:var(--text);}
  .player-btn.active{background:var(--gold);border-color:var(--gold);color:var(--bg);text-shadow:0 1px 2px rgba(0,0,0,.4);}

  /* Batuhan — Galatasaray (kırmızı / turuncuya yakın sarı, yarı yarıya) */
  .player-btn.p-gs{
    background:linear-gradient(135deg,#A32638 50%,#F2A93B 50%);
    border-color:#A32638;color:#fff;
    -webkit-text-stroke:0.5px rgba(0,0,0,.5);
  }
  .player-btn.p-gs.active{box-shadow:0 0 0 2px #fff;}

  /* Furkan / Ahmet / Samet — Beşiktaş (siyah / beyaz, yarı yarıya) */
  .player-btn.p-bjk{
    background:linear-gradient(135deg,#0a0a0a 50%,#ffffff 50%);
    border-color:#fff;color:#fff;
    -webkit-text-stroke:0.6px #000;
  }
  .player-btn.p-bjk.active{box-shadow:0 0 0 2px #fff;}

  /* Emre — Fenerbahçe (lacivert / sarı, yarı yarıya) */
  .player-btn.p-fb{
    background:linear-gradient(135deg,#132A6B 50%,#F6C500 50%);
    border-color:#132A6B;color:#fff;
    -webkit-text-stroke:0.5px rgba(0,0,0,.5);
  }
  .player-btn.p-fb.active{box-shadow:0 0 0 2px #fff;}

  /* Rıdvan — Türk Milli Takımı (kırmızı / beyaz, yarı yarıya) */
  .player-btn.p-tr{
    background:linear-gradient(135deg,#E30A17 50%,#ffffff 50%);
    border-color:#E30A17;color:#fff;
    -webkit-text-stroke:0.6px #B00;
  }
  .player-btn.p-tr.active{box-shadow:0 0 0 2px #fff;}

  /* Admin — her zaman dolu kırmızı, ayırt edici */
  .player-btn.admin{background:#7a1710;border-color:#c1443c;color:#fff;}
  .player-btn.admin:hover{border-color:#fff;}
  .player-btn.admin.active{background:#c1443c;box-shadow:0 0 0 2px #fff;}

  .player-btn.standings-tab{
    background:rgba(240,195,65,0.12);border-color:rgba(240,195,65,0.5);color:var(--gold);
  }
  .player-btn.standings-tab:hover{border-color:var(--gold);}
  .player-btn.standings-tab.active{background:var(--gold);color:var(--bg);box-shadow:0 0 0 2px #fff;}

  .admin-banner{
    max-width:620px;margin:0 auto 18px;text-align:center;
    background:rgba(193,68,60,0.12);border:1px solid rgba(193,68,60,0.4);
    border-radius:12px;padding:10px 14px;
    font-size:12px;font-weight:600;color:#e0837c;
  }
  .finalize-btn{
    font-family:'Poppins',sans-serif;font-weight:700;font-size:14px;color:#fff;
    background:#c1443c;border:none;border-radius:100px;padding:12px 26px;cursor:pointer;
  }
  .finalize-btn:hover{opacity:.9;}
  .finalize-btn:disabled{opacity:.5;cursor:default;}
  .reset-btn{
    font-family:'Poppins',sans-serif;font-weight:600;font-size:13px;color:#e0837c;
    background:transparent;border:1px solid rgba(193,68,60,0.5);border-radius:100px;
    padding:11px 20px;cursor:pointer;
  }
  .reset-btn:hover{background:rgba(193,68,60,0.12);border-color:#c1443c;}
  .reset-btn:disabled{opacity:.5;cursor:default;}

  .head-btns{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;}
  .standings-btn{
    font-family:'Poppins',sans-serif;font-weight:600;font-size:13px;
    color:var(--gold);background:rgba(240,195,65,0.1);border:1px solid rgba(240,195,65,0.4);
    border-radius:100px;padding:10px 20px;cursor:pointer;
  }
  .standings-btn:hover{background:rgba(240,195,65,0.18);}
  .standings-btn.active{background:var(--gold);color:var(--bg);border-color:var(--gold);}

  .standings-wrap{max-width:620px;margin:0 auto;}
  .standings-sub{
    text-align:center;font-size:12px;color:var(--text-dim);margin-bottom:22px;
  }
  .standings-table{
    background:var(--surface, rgba(255,255,255,0.03));
    border:1px solid var(--line);border-radius:16px;overflow:hidden;
  }
  .st-row{
    display:grid;
    grid-template-columns:34px 1fr 52px 52px 64px;
    align-items:center;gap:8px;
    padding:14px 16px;border-bottom:1px solid var(--line);
  }
  .st-row:last-child{border-bottom:none;}
  .st-row.st-head{
    font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--text-dim);padding:10px 16px;background:rgba(255,255,255,0.03);
  }
  .st-rank{font-family:'Poppins',sans-serif;font-weight:700;font-size:14px;color:var(--text-dim);text-align:center;}
  .st-row.top1 .st-rank{font-size:18px;}
  .st-row.top2 .st-rank{font-size:16px;}
  .st-row.top3 .st-rank{font-size:16px;}
  .st-name{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14.5px;}
  .st-dot{width:14px;height:14px;border-radius:4px;flex:0 0 auto;border:1px solid rgba(255,255,255,.3);}
  .st-mini{text-align:center;font-size:13px;color:var(--text-dim);font-family:'Poppins',sans-serif;}
  .st-total{text-align:center;font-weight:800;font-size:16px;color:var(--gold);}
  .st-row.top1{background:rgba(240,195,65,0.08);}

  .st-row3{
    display:grid;
    grid-template-columns:26px 1fr 30px 34px 34px 34px 44px;
    align-items:center;gap:6px;
    padding:12px 10px;border-bottom:1px solid var(--line);
  }
  .st-row3:last-child{border-bottom:none;}
  .st-row3.st-head{
    font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    color:var(--text-dim);padding:9px 10px;background:rgba(255,255,255,0.03);
  }
  .st-row3.top1{background:rgba(240,195,65,0.08);}
  .st-row3 .st-rank{font-family:'Poppins',sans-serif;font-weight:700;font-size:13px;color:var(--text-dim);text-align:center;}
  .st-row3.top1 .st-rank{font-size:16px;}
  .st-row3.top2 .st-rank, .st-row3.top3 .st-rank{font-size:14px;}
  .st-row3 .st-name{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .st-row3 .st-mini{text-align:center;font-family:'Poppins',sans-serif;font-weight:700;font-size:13px;color:var(--text-dim);}
  .st-row3 .st-mini.stat-exact{color:#3fb27f;}
  .st-row3 .st-mini.stat-outcome{color:#f0932b;}
  .st-row3 .st-mini.stat-wrong{color:#e0554f;}
  .st-row3 .st-total{font-family:'Poppins',sans-serif;font-weight:800;font-size:16px;color:var(--gold);text-align:center;}
  @media (max-width:400px){
    .st-row3{grid-template-columns:22px 1fr 26px 30px 30px 30px 38px;font-size:12px;}
    .st-row3 .st-name{font-size:12.5px;}
  }
  .standings-empty{
    text-align:center;color:var(--text-dim);font-size:13px;
    padding:40px 20px;line-height:1.7;
  }
  .back-btn{
    display:block;margin:22px auto 0;
    font-family:'Poppins',sans-serif;font-weight:600;font-size:13px;
    color:var(--text-dim);background:transparent;border:1px solid var(--line);
    border-radius:100px;padding:9px 20px;cursor:pointer;
  }
  .back-btn:hover{color:var(--text);border-color:var(--text-dim);}

  .h2h-pickers{
    display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:24px;
  }
  .h2h-select{
    font-family:'Poppins',sans-serif;font-weight:700;font-size:14px;color:var(--text);
    background:rgba(255,255,255,0.06);border:1px solid var(--line);border-radius:100px;
    padding:9px 16px;cursor:pointer;appearance:none;text-align:center;
  }
  .h2h-vs{font-family:'Poppins',sans-serif;font-weight:800;font-size:13px;color:var(--text-dim);}

  .h2h-score-row{
    display:flex;align-items:center;justify-content:center;gap:24px;
    background:rgba(255,255,255,0.03);border:1px solid var(--line);border-radius:16px;
    padding:24px 16px;
  }
  .h2h-total-block{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .h2h-dot{width:22px;height:22px;border-radius:6px;border:1px solid rgba(255,255,255,.3);}
  .h2h-total{font-family:'Poppins',sans-serif;font-weight:800;font-size:32px;color:var(--gold);}
  .h2h-mid{display:flex;flex-direction:column;align-items:center;gap:4px;}
  .h2h-record{font-family:'Poppins',sans-serif;font-weight:700;font-size:15px;color:var(--text);}
  .h2h-record-label{font-size:9.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em;}
  .h2h-leader{
    text-align:center;font-size:12.5px;font-weight:600;color:var(--gold);margin-top:12px;
  }

  .head{text-align:center;margin-bottom:20px;}
  .head .eyebrow{
    font-size:11px;font-weight:600;letter-spacing:.18em;
    color:var(--gold);text-transform:uppercase;
  }
  .head h1{font-weight:800;font-size:30px;letter-spacing:.01em;margin:6px 0 14px;}

  .week-strip{
    max-width:620px;margin:0 auto 24px;
    overflow-x:auto;display:flex;gap:6px;padding-bottom:4px;
    scrollbar-width:thin;
  }
  .week-strip::-webkit-scrollbar{height:5px;}
  .week-strip::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
  .week-pill{
    flex:0 0 auto;
    font-family:'Poppins',sans-serif;font-weight:600;font-size:11.5px;
    color:var(--text-dim);background:rgba(255,255,255,0.05);border:1px solid var(--line);
    border-radius:100px;width:30px;height:30px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .week-pill:hover{border-color:var(--gold);color:var(--text);}
  .week-pill.active{background:var(--gold);border-color:var(--gold);color:var(--bg);}

  .match-block{border-bottom:1px solid var(--line);}
  .match-block:last-child{border-bottom:none;}
  .match{
    display:grid;grid-template-columns:1fr 40px 92px 40px 1fr;
    align-items:center;gap:14px;padding:22px 4px 6px;
  }
  .real-tag-row{display:flex;justify-content:center;padding-bottom:16px;}
  .real-tag{
    font-family:'Poppins',sans-serif;font-weight:700;font-size:11.5px;
    padding:4px 12px;border-radius:100px;letter-spacing:.02em;
  }
  .tag-exact{color:#3fb27f;background:rgba(63,178,127,0.15);border:1px solid rgba(63,178,127,0.45);}
  .tag-outcome{color:#f0932b;background:rgba(240,147,43,0.15);border:1px solid rgba(240,147,43,0.45);}
  .tag-wrong{color:#e0554f;background:rgba(224,85,79,0.15);border:1px solid rgba(224,85,79,0.45);}
  .name{font-weight:600;font-size:15.5px;}
  .name.home{text-align:right;}
  .name.away{text-align:left;}

  .crest{width:40px;height:40px;margin:0 auto;display:flex;align-items:center;justify-content:center;border-radius:50%;overflow:hidden;}
  .crest img{width:100%;height:100%;object-fit:contain;}
  .crest .placeholder{
    width:100%;height:100%;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:'Poppins',sans-serif;font-weight:700;font-size:10px;color:#fff;
  }

  .score-box{display:flex;align-items:center;justify-content:center;gap:6px;}
  .score-box input{
    width:34px;height:38px;text-align:center;
    font-family:'Poppins',sans-serif;font-weight:700;font-size:16px;color:var(--text);
    background:rgba(255,255,255,0.06);border:1.5px solid rgba(255,255,255,0.18);
    border-radius:8px;outline:none;-moz-appearance:textfield;
  }
  .score-box input::-webkit-outer-spin-button,
  .score-box input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .score-box input:focus{border-color:var(--gold);background:rgba(240,195,65,0.1);}
  .score-box input:disabled{opacity:.55;cursor:not-allowed;}
  .score-box span{color:var(--text-dim);font-weight:600;font-size:14px;}

  .lock-notice{
    max-width:620px;margin:0 auto 18px;text-align:center;
    background:rgba(240,195,65,0.08);border:1px solid rgba(240,195,65,0.3);
    border-radius:12px;padding:10px 14px;
    font-size:12.5px;font-weight:600;color:var(--gold);
  }

  .locktime-box{
    max-width:620px;margin:0 auto 20px;
    background:linear-gradient(160deg, rgba(193,68,60,0.14), rgba(193,68,60,0.04));
    border:1px solid rgba(193,68,60,0.32);
    border-radius:18px;padding:18px 20px;
  }
  .locktime-header{
    display:flex;align-items:center;gap:8px;
    font-family:'Poppins',sans-serif;font-weight:700;font-size:13px;
    color:#e8938c;margin-bottom:14px;letter-spacing:.01em;
  }
  .locktime-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .locktime-box input[type="datetime-local"]{
    flex:1;min-width:190px;
    font-family:'Poppins',sans-serif;font-weight:600;font-size:13.5px;color:#fff;
    background:rgba(0,0,0,0.25);border:1px solid rgba(255,255,255,0.14);border-radius:10px;
    padding:10px 12px;color-scheme:dark;
  }
  .locktime-box input[type="datetime-local"]:focus{
    outline:none;border-color:#c1443c;background:rgba(0,0,0,0.35);
  }
  .locktime-set-btn{
    font-family:'Poppins',sans-serif;font-weight:700;font-size:13px;color:#fff;
    background:linear-gradient(135deg,#c1443c,#9c332c);border:none;border-radius:10px;
    padding:10px 20px;cursor:pointer;flex:0 0 auto;
    box-shadow:0 2px 8px rgba(193,68,60,0.35);
  }
  .locktime-set-btn:hover{filter:brightness(1.08);}
  .locktime-status{
    display:flex;align-items:center;gap:7px;
    margin-top:13px;font-size:12px;color:var(--text-dim);
  }
  .locktime-status .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;}
  .locktime-status .dot.set{background:#3fb27f;box-shadow:0 0 6px rgba(63,178,127,.7);}
  .locktime-status .dot.unset{background:#666;}

  .footer-bar{max-width:620px;margin:26px auto 0;display:flex;align-items:center;justify-content:center;gap:14px;}
  .save-btn{
    font-family:'Poppins',sans-serif;font-weight:700;font-size:14px;color:var(--bg);
    background:var(--green);border:none;border-radius:100px;padding:12px 30px;cursor:pointer;
  }
  .save-btn:hover{opacity:.9;}
  .save-btn:disabled{opacity:.5;cursor:default;}
  .refresh-btn{
    font-family:'Poppins',sans-serif;font-weight:700;font-size:14px;color:var(--text);
    background:rgba(255,255,255,0.08);border:1px solid var(--line);border-radius:100px;
    padding:12px 22px;cursor:pointer;
  }
  .refresh-btn:hover{border-color:var(--gold);color:var(--gold);}
  .refresh-btn:disabled{opacity:.5;cursor:default;}
  .save-status{font-size:12.5px;font-weight:600;color:var(--green);opacity:0;transition:opacity .2s ease;}
  .save-status.show{opacity:1;}

  .note{text-align:center;font-size:11.5px;color:var(--text-dim);margin-top:26px;line-height:1.7;}
</style>
</head>
<body>
<div class="wrap">

  <div class="player-bar" id="playerBar"></div>

  <div id="adminBanner"></div>

  <div class="head">
    <div class="eyebrow">Trendyol Süper Lig · 2026/2027</div>
    <h1 id="weekTitle">1. Hafta</h1>
  </div>

  <div class="week-strip" id="weekStrip"></div>

  <div id="fixtureView">
    <div id="lockTimeBox"></div>
  <div id="lockNotice"></div>
  <div id="fixtures"></div>

    <div class="footer-bar">
      <button class="save-btn" id="saveBtn">Skorları Kaydet</button>
      <button class="refresh-btn" id="refreshBtn">Yenile ↻</button>
      <span class="save-status" id="saveStatus">Kaydedildi ✓</span>
    </div>

    <div class="footer-bar" id="finalizeBar" style="display:none; margin-top:12px; gap:10px;">
      <button class="finalize-btn" id="finalizeBtn">Sonuçları Kesinleştir</button>
      <button class="reset-btn" id="resetBtn">Verileri Sıfırla</button>
    </div>

    <div class="note">
      Skorlar herkesle ortak, buluta kaydediliyor — arkadaşlarının yeni<br>
      girdiklerini görmek için "Yenile" butonuna bas.
    </div>
  </div>

  <div id="standingsView" style="display:none;"></div>

  <div id="h2hView" style="display:none;"></div>

</div>

<script>
// ---------- KULÜPLER (gerçek forma renkleri + aynı depodaki logolar) ----------
const LOGO_BASE = ""; // index.html logolarla aynı klasörde olduğu için göreli yol yeterli
const CLUBS = {
  "Galatasaray":              {code:"GS",  c1:"#A32638", c2:"#F5B301", logo:"exgalatasaray.png"},
  "Arca Çorum FK":            {code:"ÇOR", c1:"#B01E2C", c2:"#151515", logo:"corumfk.png"},
  "Kasımpaşa":                {code:"KAS", c1:"#0F2A5C", c2:"#3a5a9c", logo:"kasimpasa.png"},
  "Trabzonspor":              {code:"TS",  c1:"#7A1F3D", c2:"#122A55", logo:"ts.png"},
  "Konyaspor":                {code:"KON", c1:"#0E7A3D", c2:"#3aa866", logo:"konyaspor2.png"},
  "Çaykur Rizespor":          {code:"RİZ", c1:"#127A4E", c2:"#0B2A55", logo:"rize.png"},
  "Gençlerbirliği":           {code:"GB",  c1:"#A6192E", c2:"#151515", logo:"genclerbirligi.png"},
  "Fenerbahçe":               {code:"FB",  c1:"#132A6B", c2:"#F6C500", logo:"fenerbahce.png"},
  "Gaziantep FK":             {code:"GFK", c1:"#A6192E", c2:"#151515", logo:"gaziantepfk.png"},
  "Corendon Alanyaspor":      {code:"ALN", c1:"#E8720C", c2:"#127A4E", logo:"alanyaspor1.png"},
  "İstanbul Başakşehir":      {code:"İBFK",c1:"#E8720C", c2:"#0F2A5C", logo:"istanbulbasaksehir.png"},
  "Kocaelispor":              {code:"KCE", c1:"#127A4E", c2:"#151515", logo:"kocaelispor11.png"},
  "Amed Sportif Faaliyetler": {code:"AMED",c1:"#C8102E", c2:"#127A4E", logo:"tff02.png"},
  "Erzurumspor FK":           {code:"EZS", c1:"#0F3E8C", c2:"#3a6ac2", logo:"Erzurumsporfk.png"},
  "Beşiktaş":                 {code:"BJK", c1:"#151515", c2:"#3a3a3a", logo:"exbesiktas51.png"},
  "Eyüpspor":                 {code:"EYP", c1:"#5B2A86", c2:"#F6C500", logo:"eyupspor.png"},
  "Samsunspor":               {code:"SAM", c1:"#C8102E", c2:"#151515", logo:"samsunspor.png"},
  "Göztepe":                  {code:"GÖZ", c1:"#F2C230", c2:"#C8102E", logo:"goztepe1.png"},
};

// ---------- 34 HAFTALIK GERÇEK FİKSTÜR ----------
const FIXTURES_BY_WEEK = [

function crestHTML(teamName){
  const c = CLUBS[teamName];
  if(c.logo){
    return `<div class="crest"><img data-team="${teamName}" alt="${teamName}"></div>`;
  }
  return `<div class="crest"><div class="placeholder" style="background:linear-gradient(135deg, ${c.c1}, ${c.c2});">${c.code}</div></div>`;
}

function wireCrestImages(){
  document.querySelectorAll('.crest img[data-team]').forEach(img => {
    const teamName = img.getAttribute('data-team');
    const c = CLUBS[teamName];
    img.onerror = () => {
      img.parentElement.innerHTML = `<div class="placeholder" style="background:linear-gradient(135deg, ${c.c1}, ${c.c2});">${c.code}</div>`;
    };
    img.src = LOGO_BASE + c.logo;
  });
}

function renderPlayerBar(){
  const bar = document.getElementById('playerBar');
  bar.innerHTML = '';
  const PLAYER_TEAM_CLASS = {
    "Batuhan": "p-gs",
    "Bora": "p-gs",
    "Furkan": "p-bjk",
    "Ahmet": "p-bjk",
    "Samet": "p-bjk",
    "Emre": "p-fb",
    "Rıdvan": "p-tr",
  };
  PLAYERS.forEach(p => {
    const btn = document.createElement('button');
    const teamClass = PLAYER_TEAM_CLASS[p] || '';
    btn.className = 'player-btn ' + teamClass + (p === currentPlayer && !standingsOpen && !h2hOpen ? ' active' : '');
    btn.textContent = p;
    btn.onclick = () => { currentPlayer = p; closeOverlays(); renderPlayerBar(); renderFixtures(); };
    bar.appendChild(btn);
  });
  const adminBtn = document.createElement('button');
  adminBtn.className = 'player-btn admin' + (currentPlayer === ADMIN_NAME && !standingsOpen && !h2hOpen ? ' active' : '');
  adminBtn.textContent = ADMIN_NAME;
  adminBtn.onclick = () => { currentPlayer = ADMIN_NAME; closeOverlays(); renderPlayerBar(); renderFixtures(); };
  bar.appendChild(adminBtn);

  const standingsBtn = document.createElement('button');
  standingsBtn.className = 'player-btn standings-tab' + (standingsOpen ? ' active' : '');
  standingsBtn.textContent = '🏆 Puan Durumu';
  standingsBtn.onclick = () => { toggleStandings(true); };
  bar.appendChild(standingsBtn);

  const h2hBtn = document.createElement('button');
  h2hBtn.className = 'player-btn standings-tab' + (h2hOpen ? ' active' : '');
  h2hBtn.textContent = '⚔️ Kafa Kafaya';
  h2hBtn.onclick = () => { toggleH2H(true); };
  bar.appendChild(h2hBtn);

  const banner = document.getElementById('adminBanner');
  const isAdmin = currentPlayer === ADMIN_NAME;
  banner.innerHTML = (isAdmin && !standingsOpen && !h2hOpen)
    ? `<div class="admin-banner">Admin modundasın — burada girdiğin skorlar GERÇEK maç sonucu sayılır ve puanlamayı belirler.</div>`
    : '';
  document.getElementById('saveBtn').textContent = isAdmin ? 'Gerçek Skoru Kaydet' : 'Skorları Kaydet';
  document.getElementById('finalizeBar').style.display = (isAdmin && !standingsOpen && !h2hOpen) ? 'flex' : 'none';
}

function renderWeekGrid(){
  const strip = document.getElementById('weekStrip');
  strip.innerHTML = '';
  for(let w=1; w<=34; w++){
    const btn = document.createElement('button');
    btn.className = 'week-pill' + (w === currentWeek ? ' active' : '');
    btn.textContent = w;
    btn.onclick = () => {
      currentWeek = w;
      renderFixtures();
    };
    strip.appendChild(btn);
  }
}

const JSONBIN_ID = "6a7ef481f5f4af5e29158cbf";
const JSONBIN_KEY = "$2a$10$EmfKflllq7lICCJDZSzhZumQbulwUTQyKntx.ty/2QU64x1bxkiOK";
const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_ID}`;

async function fetchAllData(){
  try{
    const res = await fetch(`${JSONBIN_URL}/latest`, {
      headers: { "X-Master-Key": JSONBIN_KEY }
    });
    if(!res.ok){
      const errText = await res.text();
      console.error("jsonbin GET hatası:", res.status, errText);
      alert(`Veri okunamadı (HTTP ${res.status}): ${errText}`);
      return {};
    }
    const json = await res.json();
    return json.record || {};
  }catch(e){
    console.error("Veri okunamadı (ağ hatası):", e);
    alert("Veri okunamadı — internet bağlantısını kontrol et. (" + e.message + ")");
    return {};
  }
}

async function writeAllData(data){
  const res = await fetch(JSONBIN_URL, {
    method: "PUT",
    headers: {
      "Content-Type": "application/json",
      "X-Master-Key": JSONBIN_KEY
    },
    body: JSON.stringify(data)
  });
  if(!res.ok){
    const errText = await res.text();
    console.error("jsonbin PUT hatası:", res.status, errText);
    throw new Error(`HTTP ${res.status}: ${errText}`);
  }
}

// ---------- PUAN DURUMU ----------
const PLAYER_DOT_COLORS = {
  "Batuhan": ["#A32638", "#F2A93B"],
  "Bora":    ["#A32638", "#F2A93B"],
  "Furkan":  ["#0a0a0a", "#ffffff"],
  "Ahmet":   ["#0a0a0a", "#ffffff"],
  "Samet":   ["#0a0a0a", "#ffffff"],
  "Emre":    ["#132A6B", "#F6C500"],
  "Rıdvan":  ["#E30A17", "#ffffff"],
};

async function renderStandings(forceRefresh){
  const el = document.getElementById('standingsView');
  el.innerHTML = `<div class="standings-empty">yükleniyor…</div>`;

  if(forceRefresh || !cachedData){
    cachedData = await fetchAllData();
  }

  const finalizedWeeks = Object.keys(cachedData.__FINALIZED__ || {}).map(Number);

  if(finalizedWeeks.length === 0){
    el.innerHTML = `
      <div class="standings-wrap">
        <div class="standings-empty">Henüz hiçbir hafta kesinleşmedi.<br>Admin bir haftayı kesinleştirdiğinde burada görünecek.</div>
        <button class="back-btn" id="backFromStandings">← Fikstüre Dön</button>
      </div>
    `;
    document.getElementById('backFromStandings').onclick = () => toggleStandings(false);
    return;
  }

  const totalResolved = finalizedWeeks.reduce((sum, w) => {
    return sum + (cachedData.__WEEK_RESOLVED__?.[w] ?? FIXTURES_BY_WEEK[w-1].length);
  }, 0);

  const rows = PLAYERS.map(p => {
    let total = 0, exact = 0, outcome = 0, wrong = 0, weeksPlayed = 0;
    finalizedWeeks.forEach(w => {
      total += (cachedData.__POINTS__?.[p]?.[w]) || 0;
      exact += (cachedData.__STATS__?.[p]?.[w]?.exact) || 0;
      outcome += (cachedData.__STATS__?.[p]?.[w]?.outcome) || 0;
      wrong += (cachedData.__STATS__?.[p]?.[w]?.wrong) || 0;
      if(cachedData.__STATS__?.[p]?.[w]?.played) weeksPlayed++;
    });
    return {p, total, exact, outcome, wrong, weeksPlayed};
  }).sort((a,b) => b.total - a.total || b.exact - a.exact);

  const medals = ['🥇','🥈','🥉'];
  const rankClass = ['top1','top2','top3'];

  el.innerHTML = `
    <div class="standings-wrap">
      <div class="standings-sub">${finalizedWeeks.length} hafta sonuçlandı — toplam puana göre sıralı</div>
      <div class="standings-table">
        <div class="st-row3 st-head">
          <div></div>
          <div>Oyuncu</div>
          <div>O</div>
          <div>Tam</div>
          <div>Trf</div>
          <div>Bil</div>
          <div>Puan</div>
        </div>
        ${rows.map((r, i) => {
          const [c1, c2] = PLAYER_DOT_COLORS[r.p] || ["#888","#888"];
          return `
            <div class="st-row3 ${rankClass[i] || ''}">
              <div class="st-rank">${medals[i] || (i+1)}</div>
              <div class="st-name">
                <div class="st-dot" style="background:linear-gradient(135deg, ${c1} 50%, ${c2} 50%);"></div>
                ${r.p}
              </div>
              <div class="st-mini">${totalResolved}</div>
              <div class="st-mini stat-exact">${r.exact}</div>
              <div class="st-mini stat-outcome">${r.outcome}</div>
              <div class="st-mini stat-wrong">${r.wrong}</div>
              <div class="st-total">${r.total}</div>
            </div>
          `;
        }).join('')}
      </div>
      <button class="back-btn" id="backFromStandings">← Fikstüre Dön</button>
    </div>
  `;
  document.getElementById('backFromStandings').onclick = () => toggleStandings(false);
}

function closeOverlays(){
  standingsOpen = false;
  h2hOpen = false;
  document.getElementById('fixtureView').style.display = 'block';
  document.getElementById('standingsView').style.display = 'none';
  document.getElementById('h2hView').style.display = 'none';
  document.getElementById('weekStrip').style.display = 'flex';
}

function toggleStandings(show){
  if(!show){ closeOverlays(); renderPlayerBar(); return; }
  standingsOpen = true;
  h2hOpen = false;
  document.getElementById('fixtureView').style.display = 'none';
  document.getElementById('standingsView').style.display = 'block';
  document.getElementById('h2hView').style.display = 'none';
  document.getElementById('weekStrip').style.display = 'none';
  renderPlayerBar();
  renderStandings(true);
}

  document.getElementById('fixtureView').style.display = 'none';
  document.getElementById('standingsView').style.display = 'none';
  document.getElementById('h2hView').style.display = 'block';
  document.getElementById('weekStrip').style.display = 'none';
  if(!h2hPlayerA) h2hPlayerA = PLAYERS[0];
  if(!h2hPlayerB) h2hPlayerB = PLAYERS[1];
  renderPlayerBar();
  renderH2H(true);
}

async function renderH2H(forceRefresh){
  const el = document.getElementById('h2hView');
  el.innerHTML = `<div class="standings-empty">yükleniyor…</div>`;

  if(forceRefresh || !cachedData){
    cachedData = await fetchAllData();
  }

  const finalizedWeeks = Object.keys(cachedData.__FINALIZED__ || {}).map(Number).sort((a,b) => a-b);

  const pickerHtml = (label, selected, otherId) => `
    <div class="h2h-picker">
      <span class="h2h-label">${label}</span>
      <select class="h2h-select" id="${otherId}">
        ${PLAYERS.map(p => `<option value="${p}" ${p===selected?'selected':''}>${p}</option>`).join('')}
      </select>
    </div>
  `;

  if(finalizedWeeks.length === 0){
    el.innerHTML = `
      <div class="standings-wrap">
        <div class="standings-empty">Henüz hiçbir hafta kesinleşmedi.<br>Karşılaştırma için en az bir hafta kesinleşmesi lazım.</div>
        <button class="back-btn" id="backFromH2H">← Fikstüre Dön</button>
      </div>
    `;
    document.getElementById('backFromH2H').onclick = () => toggleH2H(false);
    return;
  }

  let totalA = 0, totalB = 0;
  let winsA = 0, winsB = 0, ties = 0;
  const weekRows = finalizedWeeks.map(w => {
    const ptsA = (cachedData.__POINTS__?.[h2hPlayerA]?.[w]) || 0;
    const ptsB = (cachedData.__POINTS__?.[h2hPlayerB]?.[w]) || 0;
    totalA += ptsA; totalB += ptsB;
    if(ptsA > ptsB) winsA++; else if(ptsB > ptsA) winsB++; else ties++;
    return {w, ptsA, ptsB};
  });

  const [c1a, c2a] = PLAYER_DOT_COLORS[h2hPlayerA] || ["#888","#888"];
  const [c1b, c2b] = PLAYER_DOT_COLORS[h2hPlayerB] || ["#888","#888"];
  const leader = totalA > totalB ? h2hPlayerA : (totalB > totalA ? h2hPlayerB : null);

  el.innerHTML = `
    <div class="standings-wrap">
      <div class="h2h-pickers">
        ${pickerHtml('', h2hPlayerA, 'h2hSelectA')}
        <span class="h2h-vs">VS</span>
        ${pickerHtml('', h2hPlayerB, 'h2hSelectB')}
      </div>

      <div class="h2h-score-row">
        <div class="h2h-total-block">
          <div class="h2h-dot" style="background:linear-gradient(135deg, ${c1a} 50%, ${c2a} 50%);"></div>
          <div class="h2h-total">${totalA}</div>
        </div>
        <div class="h2h-mid">
          <div class="h2h-record">${winsA} - ${ties} - ${winsB}</div>
          <div class="h2h-record-label">galibiyet - berabere - galibiyet</div>
        </div>
        <div class="h2h-total-block">
          <div class="h2h-dot" style="background:linear-gradient(135deg, ${c1b} 50%, ${c2b} 50%);"></div>
          <div class="h2h-total">${totalB}</div>
        </div>
      </div>

      ${leader ? `<div class="h2h-leader">${leader} toplamda ${Math.abs(totalA-totalB)} puan önde</div>` : `<div class="h2h-leader">Toplamda berabereler</div>`}

      <div class="standings-table" style="margin-top:18px;">
        <div class="st-row st-head" style="grid-template-columns:1fr 60px 60px;">
          <div>Hafta</div>
          <div>${h2hPlayerA}</div>
          <div>${h2hPlayerB}</div>
        </div>
        ${weekRows.map(r => `
          <div class="st-row" style="grid-template-columns:1fr 60px 60px;">
            <div style="color:var(--text-dim);font-size:13px;">${r.w}. Hafta</div>
            <div class="st-mini" style="font-weight:${r.ptsA>=r.ptsB?'800':'400'};color:${r.ptsA>r.ptsB?'var(--gold)':'var(--text-dim)'};">${r.ptsA}</div>
            <div class="st-mini" style="font-weight:${r.ptsB>=r.ptsA?'800':'400'};color:${r.ptsB>r.ptsA?'var(--gold)':'var(--text-dim)'};">${r.ptsB}</div>
          </div>
        `).join('')}
      </div>

      <button class="back-btn" id="backFromH2H">← Fikstüre Dön</button>
    </div>
  `;

  document.getElementById('backFromH2H').onclick = () => toggleH2H(false);
  document.getElementById('h2hSelectA').onchange = (e) => { h2hPlayerA = e.target.value; renderH2H(false); };
  document.getElementById('h2hSelectB').onchange = (e) => { h2hPlayerB = e.target.value; renderH2H(false); };
}

async function loadWeekScores(forceRefresh){
  if(!cachedData || forceRefresh){
    cachedData = await fetchAllData();
  }
  if(currentPlayer === ADMIN_NAME){
    return (cachedData.__RESULTS__ && cachedData.__RESULTS__[currentWeek]) || {};
  }
  return (cachedData[currentPlayer] && cachedData[currentPlayer][currentWeek]) || {};
}

async function renderFixtures(forceRefresh){
  const root = document.getElementById('fixtures');
  const matches = FIXTURES_BY_WEEK[currentWeek - 1];
  document.getElementById('weekTitle').textContent = currentWeek + '. Hafta';
  renderWeekGrid();

  if(forceRefresh || !cachedData){
    root.innerHTML = matches.map(() => `<div class="match" style="opacity:.3">yükleniyor…</div>`).join('');
  }

  const saved = await loadWeekScores(forceRefresh);

  const finalized = cachedData.__FINALIZED__ && cachedData.__FINALIZED__[currentWeek];
  const lockTimeStr = cachedData.__LOCKTIME__ && cachedData.__LOCKTIME__[currentWeek];
  const timeLocked = lockTimeStr && new Date() >= new Date(lockTimeStr);
  const showRealScores = finalized && currentPlayer !== ADMIN_NAME;
  const isLocked = (finalized || timeLocked) && currentPlayer !== ADMIN_NAME;
  const adminResults = (cachedData.__RESULTS__ && cachedData.__RESULTS__[currentWeek]) || {};

  root.innerHTML = matches.map((m, idx) => {
    const [home, away] = m;
    const s = saved[idx] || {};

    let tagHtml = '';
    if(showRealScores){
      const actual = adminResults[idx];
      if(actual && actual.home !== null && actual.away !== null && actual.home !== undefined){
        let cls = 'tag-wrong';
        const hasPred = s.home !== undefined && s.home !== null && s.away !== undefined && s.away !== null;
        if(hasPred && s.home === actual.home && s.away === actual.away){
          cls = 'tag-exact';
        }else if(hasPred){
          const actualOutcome = actual.home === actual.away ? 'X' : (actual.home > actual.away ? '1' : '2');
          const predOutcome = s.home === s.away ? 'X' : (s.home > s.away ? '1' : '2');
          if(actualOutcome === predOutcome) cls = 'tag-outcome';
        }
        tagHtml = `<div class="real-tag-row"><span class="real-tag ${cls}">Gerçek: ${actual.home}-${actual.away}</span></div>`;
      }
    }

    const disabledAttr = isLocked ? 'disabled' : '';

    return `
      <div class="match-block">
        <div class="match">
          <div class="name home">${home}</div>
          ${crestHTML(home)}
          <div class="score-box">
            <input type="number" min="0" max="20" inputmode="numeric" data-idx="${idx}" data-side="home" value="${s.home ?? ''}" ${disabledAttr}>
            <span>:</span>
            <input type="number" min="0" max="20" inputmode="numeric" data-idx="${idx}" data-side="away" value="${s.away ?? ''}" ${disabledAttr}>
          </div>
          ${crestHTML(away)}
          <div class="name away">${away}</div>
        </div>
        ${tagHtml}
      </div>
    `;
  }).join('');

  let noticeText = '';
  if(finalized){
    noticeText = '🔒 Bu hafta kesinleşti — tahminler kilitlendi, değiştirilemez.';
  }else if(timeLocked){
    noticeText = '🔒 Bu haftanın kilit zamanı geçti — tahminler kilitlendi.';
  }
  document.getElementById('lockNotice').innerHTML = noticeText
    ? `<div class="lock-notice">${noticeText}</div>`
    : '';
  document.getElementById('saveBtn').style.display = isLocked ? 'none' : 'inline-block';
  document.getElementById('refreshBtn').style.display = isLocked ? 'none' : 'inline-block';

  const lockBox = document.getElementById('lockTimeBox');
  if(currentPlayer === ADMIN_NAME){
    const hasLock = !!lockTimeStr;
    const currentLabel = hasLock
      ? `Kilit: ${new Date(lockTimeStr).toLocaleString('tr-TR', {weekday:'short', day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'})}`
      : 'Bu hafta için henüz kilit zamanı ayarlanmadı';
    lockBox.innerHTML = `
      <div class="locktime-box">
        <div class="locktime-header">🔒 ${currentWeek}. Hafta — Tahmin Kilidi</div>
        <div class="locktime-row">
          <input type="datetime-local" id="lockTimeInput" value="${lockTimeStr ? lockTimeStr.slice(0,16) : ''}">
          <button class="locktime-set-btn" id="lockTimeSetBtn">Ayarla</button>
        </div>
        <div class="locktime-status">
          <span class="dot ${hasLock ? 'set' : 'unset'}"></span>
          <span>${currentLabel}</span>
        </div>
      </div>
    `;
    document.getElementById('lockTimeSetBtn').onclick = async () => {
      const val = document.getElementById('lockTimeInput').value;
      if(!val) return;
      if(!cachedData.__LOCKTIME__) cachedData.__LOCKTIME__ = {};
      cachedData.__LOCKTIME__[currentWeek] = val;
      try{
        await writeAllData(cachedData);
        renderFixtures();
      }catch(e){
        alert('Kilit zamanı kaydedilemedi: ' + e.message);
      }
    };
  }else{
    lockBox.innerHTML = '';
  }

  wireCrestImages();
}

document.getElementById('refreshBtn').addEventListener('click', async () => {
  const btn = document.getElementById('refreshBtn');
  btn.disabled = true;
  await renderFixtures(true);
  btn.disabled = false;
});

document.getElementById('saveBtn').addEventListener('click', async () => {
  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  const weekData = {};
  document.querySelectorAll('#fixtures .match').forEach((row, idx) => {
    const homeInput = row.querySelector('input[data-side="home"]');
    const awayInput = row.querySelector('input[data-side="away"]');
    if(!homeInput || !awayInput) return;
    const homeVal = homeInput.value;
    const awayVal = awayInput.value;
    if(homeVal !== '' || awayVal !== ''){
      weekData[idx] = {
        home: homeVal === '' ? null : parseInt(homeVal),
        away: awayVal === '' ? null : parseInt(awayVal),
      };
    }
  });
  try{
    if(!cachedData) cachedData = await fetchAllData();
    if(currentPlayer === ADMIN_NAME){
      if(!cachedData.__RESULTS__) cachedData.__RESULTS__ = {};
      cachedData.__RESULTS__[currentWeek] = weekData;
    }else{
      if(!cachedData[currentPlayer]) cachedData[currentPlayer] = {};
      cachedData[currentPlayer][currentWeek] = weekData;
    }
    await writeAllData(cachedData);
    const status = document.getElementById('saveStatus');
    status.classList.add('show');
    setTimeout(() => status.classList.remove('show'), 1800);
  }catch(e){
    console.error("Kaydetme hatası:", e);
    alert('Kaydetme başarısız oldu: ' + e.message);
  }
  btn.disabled = false;
});

document.getElementById('finalizeBtn').addEventListener('click', async () => {
  const btn = document.getElementById('finalizeBtn');
  btn.disabled = true;
  try{
    if(!cachedData) cachedData = await fetchAllData();
    const results = (cachedData.__RESULTS__ && cachedData.__RESULTS__[currentWeek]) || {};
    const matches = FIXTURES_BY_WEEK[currentWeek - 1];

    if(!cachedData.__POINTS__) cachedData.__POINTS__ = {};
    if(!cachedData.__STATS__) cachedData.__STATS__ = {};
    if(!cachedData.__WEEK_RESOLVED__) cachedData.__WEEK_RESOLVED__ = {};

    const resolvedCount = matches.filter((m, idx) => {
      const actual = results[idx];
      return actual && actual.home !== null && actual.away !== null && actual.home !== undefined;
    }).length;
    cachedData.__WEEK_RESOLVED__[currentWeek] = resolvedCount;

    PLAYERS.forEach(player => {
      const prediction = (cachedData[player] && cachedData[player][currentWeek]) || {};
      let total = 0;
      let exactHits = 0;
      let outcomeHits = 0;
      let wrongHits = 0;

      matches.forEach((m, idx) => {
        const actual = results[idx];
        const pred = prediction[idx];
        if(!actual || actual.home === null || actual.away === null) return; // gerçek skor girilmemiş
        if(!pred || pred.home === null || pred.away === null) return; // tahmin girilmemiş -> sayılmaz

        if(pred.home === actual.home && pred.away === actual.away){
          total += 3; // isabetli skor
          exactHits++;
        }else{
          const actualOutcome = actual.home === actual.away ? 'X' : (actual.home > actual.away ? '1' : '2');
          const predOutcome = pred.home === pred.away ? 'X' : (pred.home > pred.away ? '1' : '2');
          if(actualOutcome === predOutcome){
            total += 1; // doğru taraf/beraberlik
            outcomeHits++;
          }else{
            wrongHits++; // ne skor ne taraf tuttu
          }
        }
      });

      if(!cachedData.__POINTS__[player]) cachedData.__POINTS__[player] = {};
      cachedData.__POINTS__[player][currentWeek] = total;

      if(!cachedData.__STATS__[player]) cachedData.__STATS__[player] = {};
      cachedData.__STATS__[player][currentWeek] = {
        exact: exactHits,
        outcome: outcomeHits,
        wrong: wrongHits,
        played: Object.keys(prediction).length > 0
      };
    });

    if(!cachedData.__FINALIZED__) cachedData.__FINALIZED__ = {};
    cachedData.__FINALIZED__[currentWeek] = true;

    await writeAllData(cachedData);
    alert(`${currentWeek}. hafta sonuçlandırıldı ve puanlar dağıtıldı. Puan Durumu sekmesinden görebilirsin.`);
  }catch(e){
    console.error("Kesinleştirme hatası:", e);
    alert('Kesinleştirme başarısız oldu: ' + e.message);
  }
  btn.disabled = false;
});

document.getElementById('resetBtn').addEventListener('click', async () => {
  const sure1 = confirm('TÜM veriler silinecek: herkesin tüm hafta tahminleri, admin sonuçları ve puan durumu. Bu işlem geri alınamaz. Emin misin?');
  if(!sure1) return;
  const sure2 = confirm('Son kez soruyorum — gerçekten her şeyi sıfırlamak istiyor musun?');
  if(!sure2) return;

  const btn = document.getElementById('resetBtn');
  btn.disabled = true;
  try{
    cachedData = { "_reset_at": new Date().toISOString() };
    await writeAllData(cachedData);
    alert('Tüm veriler sıfırlandı.');
    renderFixtures(true);
  }catch(e){
    console.error("Sıfırlama hatası:", e);
    alert('Sıfırlama başarısız oldu: ' + e.message);
  }
  btn.disabled = false;
});

renderPlayerBar();
renderFixtures();
</script>
